<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel · Duda Kuerten Produções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0a; --white:#ffffff;
  --g900:#141414; --g800:#1c1c1c; --g700:#2a2a2a; --g500:#6e6e6e; --g300:#aeaeae;
  --g100:#e4e4e4; --g50:#f3f3f1;
  --line:#e4e4e4; --line-dark:#2a2a2a;
  --ok:#2f7a3c; --ok-bg:#e9f3ea;
  --warn:#9c6b08; --warn-bg:#faf1dd;
  --danger:#b03a3a; --danger-bg:#fbe9e9;
  --info:#3a5a86; --info-bg:#e9eef5;
  --display:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --radius:3px;
  --sidebar-w:232px;
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--body); color:var(--black); background:var(--g50);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ margin:0; font-family:var(--display); font-weight:600; }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
button{ font-family:var(--body); cursor:pointer; }
input,select,textarea{ font-family:var(--body); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--g100); border-radius:6px; }

/* ---------------- layout ---------------- */
.app{ display:flex; min-height:100vh; }

.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--black); color:var(--white);
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0;
  z-index:60;
}
.sidebar-logo{ padding:1.3rem 1.4rem .9rem; }
.sidebar-logo img{ height:16px; width:auto; max-width:100%; }
.sidebar-logo .logo-mono{ display:none; height:22px; }
.sidebar-nav{ flex:1; padding:.5rem .8rem; overflow-y:auto; }
.nav-group-label{
  font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--g300);
  padding:1rem .6rem .4rem;
}
.nav-link{
  display:flex; align-items:center; gap:.65rem; padding:.62rem .6rem; border-radius:var(--radius);
  font-size:.88rem; font-weight:500; color:#d8d8d8; margin-bottom:.1rem;
}
.nav-link .ic{ width:1.1rem; text-align:center; opacity:.8; font-size:.95rem; }
.nav-link:hover{ background:var(--g900); color:var(--white); }
.nav-link.active{ background:var(--white); color:var(--black); }
.nav-link .count{
  margin-left:auto; font-size:.72rem; background:var(--g800); color:var(--g300);
  padding:.05rem .4rem; border-radius:10px;
}
.nav-link.active .count{ background:var(--g100); color:var(--black); }

.sidebar-foot{ padding:.9rem 1rem 1.2rem; border-top:1px solid var(--line-dark); }
.sidebar-foot button{
  width:100%; background:none; border:1px solid var(--g700); color:var(--g300);
  font-size:.76rem; padding:.5rem .6rem; border-radius:var(--radius); margin-bottom:.4rem;
}
.sidebar-foot button:hover{ border-color:var(--g300); color:var(--white); }

.main{ flex:1; margin-left:var(--sidebar-w); min-width:0; }
.topbar{
  position:sticky; top:0; z-index:40; background:rgba(243,243,241,.92); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line); padding:1.1rem 2rem; display:flex; align-items:center;
  justify-content:space-between; gap:1rem; flex-wrap:wrap;
}
.topbar h1{ font-size:1.5rem; }
.topbar-sub{ font-size:.82rem; color:var(--g500); margin-top:.2rem; }
.topbar-actions{ display:flex; gap:.6rem; align-items:center; }

.view{ padding:1.8rem 2rem 4rem; max-width:1280px; }

@media (max-width:980px){
  :root{ --sidebar-w:188px; }
  .topbar{ padding:1rem 1.2rem; }
  .view{ padding:1.3rem 1.1rem 3rem; }
}
@media (max-width:620px){
  :root{ --sidebar-w:60px; }
  .sidebar-logo{ padding:1rem .6rem; display:flex; justify-content:center; }
  .sidebar-logo .logo-full{ display:none; }
  .sidebar-logo .logo-mono{ display:block; }
  .nav-group-label{ display:none; }
  .nav-link{ justify-content:center; padding:.6rem .3rem; }
  .nav-link .ic{ font-size:1.05rem; }
  .nav-label, .nav-link .count{ display:none; }
  .sidebar-foot{ padding:.6rem; }
  .sidebar-foot button{ font-size:0; padding:.5rem; }
  .sidebar-foot button::first-letter{ font-size:.9rem; }
  .topbar{ padding:.9rem .8rem; }
  .topbar h1{ font-size:1.2rem; }
}

/* ---------------- buttons ---------------- */
.btn{
  display:inline-flex; align-items:center; gap:.4rem; font-size:.84rem; font-weight:600;
  padding:.55rem 1rem; border-radius:var(--radius); border:1px solid var(--black);
  background:var(--black); color:var(--white); white-space:nowrap;
}
.btn:hover{ background:#262626; }
.btn.secondary{ background:var(--white); color:var(--black); }
.btn.secondary:hover{ background:var(--g50); }
.btn.ghost{ background:transparent; color:var(--g500); border-color:var(--line); }
.btn.ghost:hover{ color:var(--black); border-color:var(--g300); }
.btn.danger{ background:var(--white); color:var(--danger); border-color:var(--danger-bg); }
.btn.danger:hover{ background:var(--danger-bg); }
.btn.small{ padding:.36rem .7rem; font-size:.76rem; }
.icon-btn{
  background:none; border:1px solid var(--line); border-radius:var(--radius); width:1.9rem; height:1.9rem;
  font-size:.82rem; color:var(--g500); display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover{ color:var(--black); border-color:var(--g300); }

/* ---------------- cards / grids ---------------- */
.cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:2rem; }
.card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:1.2rem; }
.card .kpi-label{ font-size:.74rem; color:var(--g500); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.5rem; }
.card .kpi-num{ font-family:var(--display); font-size:2rem; font-weight:800; letter-spacing:-.01em; line-height:1; }
.card .kpi-sub{ font-size:.76rem; color:var(--g500); margin-top:.4rem; }
@media (max-width:980px){ .cards{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:560px){ .cards{ grid-template-columns:1fr; } }

.panel{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:1.6rem; }
.panel-head{
  display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
  padding:1.1rem 1.3rem; border-bottom:1px solid var(--line);
}
.panel-head h3{ font-size:1.05rem; }
.panel-body{ padding:1.3rem; }
.panel-body.pad0{ padding:0; }

.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:1.6rem; }
@media (max-width:900px){ .two-col{ grid-template-columns:1fr; } }

/* ---------------- tables ---------------- */
table{ width:100%; border-collapse:collapse; font-size:.86rem; }
th{
  text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--g500);
  padding:.7rem 1rem; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{ padding:.8rem 1rem; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:var(--g50); }
.table-wrap{ overflow-x:auto; }
td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
.row-link{ font-weight:600; }
.row-link:hover{ text-decoration:underline; }
.muted{ color:var(--g500); }
.small{ font-size:.78rem; }

/* ---------------- badges ---------------- */
.badge{
  display:inline-flex; align-items:center; gap:.3rem; font-size:.72rem; font-weight:600;
  padding:.2rem .55rem; border-radius:12px; white-space:nowrap;
}
.badge.gray{ background:var(--g100); color:var(--g500); }
.badge.ok{ background:var(--ok-bg); color:var(--ok); }
.badge.warn{ background:var(--warn-bg); color:var(--warn); }
.badge.danger{ background:var(--danger-bg); color:var(--danger); }
.badge.info{ background:var(--info-bg); color:var(--info); }
.stars{ color:#c9a227; letter-spacing:1px; font-size:.78rem; }
.stars .off{ color:var(--g100); }

/* ---------------- empty state ---------------- */
.empty{ padding:2.6rem 1.5rem; text-align:center; color:var(--g500); }
.empty .ic{ font-size:1.6rem; margin-bottom:.6rem; opacity:.5; }
.empty .btn{ margin-top:1rem; }

/* ---------------- forms / modal ---------------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,10,10,.5); z-index:100; display:flex;
  align-items:flex-start; justify-content:center; padding:4vh 1rem; overflow-y:auto;
}
.modal{
  background:var(--white); width:100%; max-width:560px; border-radius:4px; margin-bottom:4vh;
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between; padding:1.2rem 1.4rem;
  border-bottom:1px solid var(--line);
}
.modal-head h3{ font-size:1.15rem; }
.modal-close{ background:none; border:none; font-size:1.2rem; color:var(--g500); line-height:1; }
.modal-body{ padding:1.4rem; }
.modal-foot{
  display:flex; justify-content:flex-end; gap:.6rem; padding:1.1rem 1.4rem; border-top:1px solid var(--line);
}

.field{ margin-bottom:1rem; }
.field label{ display:block; font-size:.78rem; font-weight:600; margin-bottom:.35rem; color:var(--g500); }
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:.6rem .7rem;
  font-size:.88rem; color:var(--black); background:var(--white);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--black); outline-offset:0; }
.field textarea{ resize:vertical; min-height:4.2rem; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
@media (max-width:520px){ .field-row{ grid-template-columns:1fr; } }
.field-hint{ font-size:.72rem; color:var(--g300); margin-top:.3rem; }

.filters{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
.filters input, .filters select{
  border:1px solid var(--line); border-radius:var(--radius); padding:.5rem .7rem; font-size:.82rem;
  background:var(--white);
}
.search-input{ min-width:200px; }

/* ---------------- event detail ---------------- */
.event-header{
  background:var(--black); color:var(--white); border-radius:4px; padding:1.6rem 1.8rem; margin-bottom:1.6rem;
  display:flex; justify-content:space-between; gap:1.4rem; flex-wrap:wrap;
}
.event-header .eyebrow{ font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--g300); margin-bottom:.5rem; }
.event-header h2{ font-size:1.7rem; margin-bottom:.5rem; }
.event-meta{ display:flex; flex-wrap:wrap; gap:1.4rem; font-size:.84rem; color:var(--g300); }
.event-meta strong{ color:var(--white); font-weight:600; }
.event-header-actions{ display:flex; gap:.5rem; align-items:flex-start; }

.subtabs{ display:flex; gap:.3rem; border-bottom:1px solid var(--line); margin-bottom:1.4rem; flex-wrap:wrap; }
.subtab{
  padding:.65rem 1rem; font-size:.84rem; font-weight:600; color:var(--g500); border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.subtab:hover{ color:var(--black); }
.subtab.active{ color:var(--black); border-bottom-color:var(--black); }

.totals-bar{ display:flex; gap:2rem; flex-wrap:wrap; padding:1rem 1.3rem; background:var(--g50); border-top:1px solid var(--line); }
.totals-bar .t{ font-size:.76rem; color:var(--g500); text-transform:uppercase; letter-spacing:.05em; }
.totals-bar .v{ font-family:var(--display); font-size:1.15rem; font-weight:700; }

.kanban{ display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
@media (max-width:900px){ .kanban{ grid-template-columns:1fr; } }
.kanban-col{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); }
.kanban-col-head{ padding:.9rem 1rem; border-bottom:1px solid var(--line); font-size:.82rem; font-weight:700; display:flex; justify-content:space-between; }
.kanban-list{ padding:.7rem; display:flex; flex-direction:column; gap:.6rem; min-height:60px; }
.task-card{ border:1px solid var(--line); border-radius:var(--radius); padding:.7rem .8rem; }
.task-card .tt{ font-size:.85rem; font-weight:600; margin-bottom:.3rem; }
.task-card .tm{ font-size:.72rem; color:var(--g500); display:flex; justify-content:space-between; gap:.5rem; }
.task-card .tm-actions{ margin-top:.5rem; display:flex; gap:.35rem; }

.vendor-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
@media (max-width:980px){ .vendor-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:640px){ .vendor-grid{ grid-template-columns:1fr; } }
.vendor-card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:1.2rem; }
.vendor-card .vn{ font-family:var(--display); font-weight:600; font-size:1.1rem; margin-bottom:.25rem; }
.vendor-card .vc{ font-size:.76rem; color:var(--g500); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.6rem; }
.vendor-card .vrow{ font-size:.82rem; margin-bottom:.3rem; display:flex; justify-content:space-between; gap:.5rem; }
.vendor-card .vactions{ margin-top:.9rem; display:flex; gap:.4rem; }

/* ---------------- deliverables: lista view strip ---------------- */
.overdue-flag{ color:var(--danger); font-weight:700; font-size:.72rem; margin-left:.4rem; }

/* ---------------- deliverables: agenda (calendar) ---------------- */
.cal-head{ display:flex; align-items:center; justify-content:space-between; padding:0 0 1rem; }
.cal-head .cal-title{ font-family:var(--display); font-weight:700; font-size:1.05rem; text-transform:capitalize; }
.cal-nav{ display:flex; gap:.4rem; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
.cal-dow{ padding:.5rem; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--g500); text-align:center; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--g50); }
.cal-cell{ min-height:84px; padding:.4rem; border-right:1px solid var(--line); border-bottom:1px solid var(--line); vertical-align:top; }
.cal-cell.out{ background:var(--g50); }
.cal-daynum{ font-size:.74rem; color:var(--g500); margin-bottom:.3rem; }
.cal-cell.today .cal-daynum{ display:inline-flex; align-items:center; justify-content:center; width:1.3rem; height:1.3rem; background:var(--black); color:var(--white); border-radius:50%; }
.cal-chip{
  font-size:.68rem; padding:.18rem .4rem; border-radius:3px; margin-bottom:.25rem; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;
}
.cal-chip.gray{ background:var(--g100); color:var(--black); }
.cal-chip.warn{ background:var(--warn-bg); color:var(--warn); }
.cal-chip.ok{ background:var(--ok-bg); color:var(--ok); }
.cal-chip.danger{ background:var(--danger-bg); color:var(--danger); font-weight:700; }
@media (max-width:760px){
  .cal-cell{ min-height:54px; }
  .cal-dow{ font-size:.6rem; padding:.35rem .1rem; }
}

/* ---------------- deliverables: gantt ---------------- */
.gantt{ display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--white); }
.gantt-labels{ flex:none; width:200px; border-right:1px solid var(--line); }
.gantt-label-head{ height:38px; border-bottom:1px solid var(--line); background:var(--g50); }
.gantt-label-row{ height:46px; display:flex; flex-direction:column; justify-content:center; padding:0 .8rem; border-bottom:1px solid var(--line); }
.gantt-label-row .gl-t{ font-size:.8rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gantt-label-row .gl-s{ font-size:.68rem; color:var(--g500); }
.gantt-scroll{ flex:1; overflow-x:auto; }
.gantt-timeline{ position:relative; }
.gantt-ticks{ height:38px; position:relative; border-bottom:1px solid var(--line); background:var(--g50); }
.gantt-tick{ position:absolute; top:0; height:100%; display:flex; align-items:center; font-size:.66rem; color:var(--g500); padding-left:.4rem; border-left:1px solid var(--line); white-space:nowrap; }
.gantt-rows{ position:relative; }
.gantt-row{ height:46px; border-bottom:1px solid var(--line); position:relative; }
.gantt-bar{
  position:absolute; top:9px; height:28px; border-radius:4px; font-size:.7rem; color:#fff;
  display:flex; align-items:center; padding:0 .5rem; white-space:nowrap; overflow:hidden; cursor:pointer;
  border:1px solid rgba(0,0,0,.15);
}
.gantt-bar.gray{ background:#8a8a8a; }
.gantt-bar.warn{ background:#b8860b; }
.gantt-bar.ok{ background:#2f7a3c; }
.gantt-bar.overdue{ outline:2px solid var(--danger); outline-offset:1px; }
.gantt-today-line{ position:absolute; top:0; bottom:0; width:2px; background:var(--danger); z-index:5; }
.gantt-today-label{ position:absolute; top:-1.1rem; font-size:.62rem; color:var(--danger); font-weight:700; white-space:nowrap; }

.toast{
  position:fixed; bottom:1.4rem; left:50%; transform:translateX(-50%) translateY(10px); z-index:200;
  background:var(--black); color:var(--white); padding:.7rem 1.2rem; border-radius:var(--radius);
  font-size:.84rem; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.confirm-box p{ font-size:.9rem; line-height:1.5; margin-bottom:1.2rem; }

:focus-visible{ outline:2px solid var(--black); outline-offset:2px; }
</style>
</head>
<body>

<div class="app">

<script>
/* =========================================================
   DUDA KUERTEN PRODUÇÕES — PAINEL DO PRODUTOR
   Single-file app. Data persisted in localStorage.
   ========================================================= */

/* ---------------- storage ---------------- */
const DB_KEY = 'dk_painel_producao_v1';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function seedData(){
  const eventId = uid();
  const vendorId = uid();
  return {
    events: [
      {
        id: eventId, nome:'IX Encontro Nacional Mini Kalzone', cliente:'Agência Diferencial',
        local:'Costão do Santinho, Florianópolis - SC', dataInicio:'2026-09-16', dataFim:'2026-09-18',
        status:'Em produção', participantes:200, valorContrato:0,
        notas:'Produção completa (ponta a ponta) pela Agência Diferencial.'
      }
    ],
    vendors: [
      {
        id: vendorId, nome:'Fornecedor de pager/coaster (chamada de mesa)', categoria:'Equipamentos',
        contato:'', telefone:'', email:'', avaliacao:2,
        notas:'Ficar atenta em próximas contratações — ver ocorrência registrada.'
      }
    ],
    crew: [],
    tasks: [],
    budgetItems: [],
    schedule: [],
    deliverables: [],
    rundown: [],
    logistica: [],
    incidents: [
      {
        id: uid(), eventoId: eventId, fornecedorId: vendorId,
        titulo:'Entrega incompleta do sistema de pager/coaster',
        data:'', gravidade:'Alta',
        descricao:'Apenas 1 unidade base foi entregue, em vez das 2 combinadas. Fornecedor não deu suporte a tempo.',
        resolucao:'Avaliar equipamento próprio (walkie-talkies / sets de pager) para próximos eventos.'
      }
    ]
  };
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return seedData();
    const parsed = JSON.parse(raw);
    ['events','vendors','crew','tasks','budgetItems','schedule','deliverables','rundown','logistica','incidents'].forEach(k=>{
      if(!Array.isArray(parsed[k])) parsed[k] = [];
    });
    return parsed;
  }catch(e){
    console.error('Erro ao carregar dados', e);
    return seedData();
  }
}

let DB = loadDB();
function save(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}

/* ---------------- helpers ---------------- */
function fmtMoney(v){
  v = Number(v)||0;
  return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return `${d}/${m}/${y}`;
}
function fmtDateRange(a,b){
  if(!a && !b) return '—';
  if(a && b && a!==b) return `${fmtDate(a)} – ${fmtDate(b)}`;
  return fmtDate(a||b);
}
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(iso+'T00:00:00');
  return Math.round((d-today)/86400000);
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function byId(arr,id){ return arr.find(x=>x.id===id); }
function nameOrDash(obj, key){ return obj && obj[key] ? obj[key] : '—'; }

function eventName(id){ const e = byId(DB.events,id); return e ? e.nome : '— (geral)'; }
function vendorName(id){ const v = byId(DB.vendors,id); return v ? v.nome : '—'; }

/* status option sets */
const EVENT_STATUS = ['Prospecção','Orçamento','Confirmado','Em produção','Concluído','Cancelado'];
const VENDOR_CATS = ['Som e Iluminação','Catering/Buffet','Decoração','Estrutura/Tenda','Segurança','Transporte','Fotografia/Vídeo','Comunicação Visual','Equipamentos','Cerimonial','Outros'];
const CREW_ROLES = ['Coordenador(a) de produção','Produtor(a) de palco','Recepção/Credenciamento','Segurança','Técnico(a) de som','Técnico(a) de luz','Fotógrafo(a)/Vídeo','Freelancer geral','Outros'];
const TASK_PHASES = ['Pré-produção','Durante o evento','Pós-evento'];
const TASK_STATUS = ['A fazer','Em andamento','Concluída'];
const PAY_STATUS = ['Pendente','Parcial','Pago'];
const SEVERITY = ['Baixa','Média','Alta','Crítica'];
const DELIV_STATUS = ['Não iniciado','Em andamento','Concluído'];
const TM_STATUS = ['Pendente','Em andamento','Concluído'];
const RUNDOWN_LIVE_STATUS = ['Pendente','No ar','Concluído'];
const LOGISTICA_TRANSPORTE = ['Frete próprio','Transportadora terceirizada','Fornecedor entrega no local','Retirar no fornecedor','Já está no local'];
const LOGISTICA_STATUS = ['Pendente','Confirmado','Em trânsito','Entregue'];

function badgeForEventStatus(s){
  const map = { 'Prospecção':'gray','Orçamento':'info','Confirmado':'ok','Em produção':'warn','Concluído':'ok','Cancelado':'danger' };
  return `<span class="badge ${map[s]||'gray'}">${escapeHtml(s||'—')}</span>`;
}
function badgeForTaskStatus(s){
  const map = { 'A fazer':'gray','Em andamento':'warn','Concluída':'ok' };
  return `<span class="badge ${map[s]||'gray'}">${escapeHtml(s)}</span>`;
}
function badgeForPay(s){
  const map = { 'Pendente':'danger','Parcial':'warn','Pago':'ok' };
  return `<span class="badge ${map[s]||'gray'}">${escapeHtml(s)}</span>`;
}
function badgeForSeverity(s){
  const map = { 'Baixa':'gray','Média':'info','Alta':'warn','Crítica':'danger' };
  return `<span class="badge ${map[s]||'gray'}">${escapeHtml(s)}</span>`;
}
function badgeForDeliverableStatus(s){
  const map = { 'Não iniciado':'gray','Em andamento':'warn','Concluído':'ok' };
  return `<span class="badge ${map[s]||'gray'}">${escapeHtml(s||'—')}</span>`;
}
function badgeForTmStatus(s){
  const map = { 'Pendente':'gray','Em andamento':'warn','Concluído':'ok' };
  return `<span class="badge ${map[s]||'gray'}">${escapeHtml(s||'Pendente')}</span>`;
}
function badgeForRundownLive(s){
  const map = { 'Pendente':'gray','No ar':'danger','Concluído':'ok' };
  return `<span class="badge ${map[s]||'gray'}">${escapeHtml(s||'Pendente')}</span>`;
}
function badgeForLogistica(s){
  const map = { 'Pendente':'danger','Confirmado':'info','Em trânsito':'warn','Entregue':'ok' };
  return `<span class="badge ${map[s]||'gray'}">${escapeHtml(s||'Pendente')}</span>`;
}
function parseISO(iso){ return iso ? new Date(iso+'T00:00:00') : null; }
function diffDays(a,b){ return Math.round((b-a)/86400000); }
function addDays(d,n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isoOf(d){ return d.toISOString().slice(0,10); }
function isOverdue(item){
  if(!item.dataFim || item.status==='Concluído') return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return parseISO(item.dataFim) < today;
}
function addMinutes(hhmm, minutes){
  const m = String(hhmm||'').match(/^(\d{1,2}):(\d{2})$/);
  if(!m || !minutes) return '';
  const total = parseInt(m[1],10)*60 + parseInt(m[2],10) + Number(minutes);
  const h = Math.floor((total%1440+1440)%1440/60);
  const mi = ((total%60)+60)%60;
  return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}
function stars(n){
  n = Number(n)||0;
  let out = '<span class="stars">';
  for(let i=1;i<=5;i++) out += `<span class="${i<=n?'':'off'}">★</span>`;
  return out + '</span>';
}

/* =========================================================

   ========================================================= */
function fieldHtml(f, data){
  const val = data && data[f.key]!=null ? data[f.key] : '';
  const wrapOpen = `<div class="field" style="${f.half?'':''}">`;
  const label = `<label for="f_${f.key}">${f.label}${f.required?' *':''}</label>`;
  let input = '';
  if(f.type==='select'){
    input = `<select id="f_${f.key}" name="${f.key}">` +
      f.options.map(o=>`<option value="${escapeHtml(o.value)}" ${String(o.value)===String(val)?'selected':''}>${escapeHtml(o.label)}</option>`).join('') +
      `</select>`;
  } else if(f.type==='textarea'){
    input = `<textarea id="f_${f.key}" name="${f.key}" placeholder="${escapeHtml(f.placeholder||'')}">${escapeHtml(val)}</textarea>`;
  } else {
    input = `<input id="f_${f.key}" name="${f.key}" type="${f.type}" ${f.step?`step="${f.step}"`:''} placeholder="${escapeHtml(f.placeholder||'')}" value="${escapeHtml(val)}">`;
  }
  return wrapOpen + label + input + `</div>`;
}

function renderFormFields(schema, data){
  let html = '';
  let i = 0;
  const fields = schema.fields;
  while(i < fields.length){
    const f = fields[i];
    if(f.half && fields[i+1] && fields[i+1].half){
      html += `<div class="field-row">${fieldHtml(f,data)}${fieldHtml(fields[i+1],data)}</div>`;
      i += 2;
    } else {
      html += fieldHtml(f,data);
      i += 1;
    }
  }
  return html;
}

let currentModalCtx = null;

function openForm(schemaKey, opts){
  // opts: { data (existing record or null), onSave(record), extraNote }
  const schema = SCHEMAS()[schemaKey];
  const data = opts.data || {};
  const isEdit = !!(opts.data && opts.data.id);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-head">
          <h3>${isEdit?'Editar':(schema.gender==='f'?'Nova':'Novo')} ${schema.title}</h3>
          <button class="modal-close" id="modalCloseBtn">✕</button>
        </div>
        <form id="modalForm">
          <div class="modal-body">
            ${opts.extraNote?`<p class="field-hint" style="margin-bottom:1rem;">${opts.extraNote}</p>`:''}
            ${renderFormFields(schema, data)}
          </div>
          <div class="modal-foot">
            <button type="button" class="btn ghost" id="modalCancelBtn">Cancelar</button>
            <button type="submit" class="btn">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  `;
  const close = ()=>{ root.innerHTML=''; };
  document.getElementById('modalCloseBtn').onclick = close;
  document.getElementById('modalCancelBtn').onclick = close;
  document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') close(); });
  document.getElementById('modalForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const record = isEdit ? Object.assign({}, data) : { id: uid() };
    schema.fields.forEach(f=>{
      let v = fd.get(f.key);
      if(f.type==='number') v = v===''? 0 : Number(v);
      record[f.key] = v;
    });
    if(schema.fields.some(f=>f.required) ){
      const missing = schema.fields.filter(f=>f.required && !record[f.key]);
      if(missing.length){ toast('Preencha: '+missing.map(m=>m.label).join(', ')); return; }
    }
    opts.onSave(record);
    close();
  });
}

  renderSidebar(key);
  const fn = { dashboard:renderDashboard, eventos:renderEventos, tarefas:renderTarefas,

  const prevDays = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=startWeekday-1;i>=0;i--) cells.push({ date:new Date(year,month-1,prevDays-i), out:true });
  for(let d=1; d<=daysInMonth; d++) cells.push({ date:new Date(year,month,d), out:false });
  let nextD = 1;
  while(cells.length%7!==0){ cells.push({ date:new Date(year,month+1,nextD), out:true }); nextD++; }
  return cells;
}

function renderDeliverablesAgenda(items){
  if(!agendaMonthCursor){
    agendaMonthCursor = new Date(); agendaMonthCursor.setDate(1); agendaMonthCursor.setHours(0,0,0,0);
  }
  const year = agendaMonthCursor.getFullYear();
  const month = agendaMonthCursor.getMonth();
  const cells = buildMonthGrid(year, month);
  const todayIso = isoOf(new Date());
  const monthLabel = agendaMonthCursor.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
  const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const byDate = {};
  items.forEach(it=>{
    const due = it.dataFim || it.dataInicio;
    if(!due) return;
    (byDate[due] = byDate[due]||[]).push(it);
  });

  return `
    <div class="cal-head">
      <div class="cal-title">${monthLabel}</div>
      <div class="cal-nav">
        <button class="icon-btn" id="calPrev" title="Mês anterior">‹</button>
        <button class="btn ghost small" id="calToday">Hoje</button>
        <button class="icon-btn" id="calNext" title="Próximo mês">›</button>
      </div>
    </div>
    <div class="cal-grid">
      ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(c=>{
        const iso = isoOf(c.date);
        const dayItems = byDate[iso] || [];
        const isToday = iso===todayIso;
        return `<div class="cal-cell ${c.out?'out':''} ${isToday?'today':''}">
          <div class="cal-daynum">${c.date.getDate()}</div>
          ${dayItems.map(it=>{
            const overdue = isOverdue(it);
            const cls = overdue?'danger':(it.status==='Concluído'?'ok':(it.status==='Em andamento'?'warn':'gray'));
            return `<span class="cal-chip ${cls}" data-edit-deliv="${it.id}" title="${escapeHtml(it.titulo)}">${escapeHtml(it.titulo)}</span>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderDeliverablesGantt(items){
  const withDates = items.filter(it=>it.dataInicio || it.dataFim);
  if(!withDates.length){
    return `<div class="empty"><div class="ic">▦</div>Defina data de início ou prazo nas entregas para ver o Gantt.</div>`;
  }
  const starts = withDates.map(it=>parseISO(it.dataInicio||it.dataFim));
  const ends = withDates.map(it=>parseISO(it.dataFim||it.dataInicio));
  let minDate = addDays(new Date(Math.min(...starts)), -1);
  let maxDate = addDays(new Date(Math.max(...ends)), 2);
  const totalDays = diffDays(minDate, maxDate)+1;
  const pxPerDay = totalDays>60 ? 18 : (totalDays>30 ? 24 : 34);
  const totalWidth = totalDays*pxPerDay;
  const todayD = new Date(); todayD.setHours(0,0,0,0);
  const todayOffset = diffDays(minDate, todayD);
  const showWeekly = totalDays>40;

  let ticks = '';
  if(showWeekly){
    for(let d=0; d<totalDays; d+=7){
      const date = addDays(minDate,d);
      ticks += `<div class="gantt-tick" style="left:${d*pxPerDay}px;">${date.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div>`;
    }
  } else {
    for(let d=0; d<totalDays; d++){
      const date = addDays(minDate,d);
      if(d===0 || date.getDay()===1){
        ticks += `<div class="gantt-tick" style="left:${d*pxPerDay}px;">${date.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div>`;
      }
    }
  }

  const rows = withDates.map(it=>{
    const s = parseISO(it.dataInicio||it.dataFim);
    const e = parseISO(it.dataFim||it.dataInicio);
    const left = diffDays(minDate,s)*pxPerDay;
    const width = Math.max((diffDays(s,e)+1)*pxPerDay - 4, 10);
    const overdue = isOverdue(it);
    const cls = it.status==='Concluído'?'ok':(it.status==='Em andamento'?'warn':'gray');
    return { it, left, width, overdue, cls };
  });

  const todayMarker = (todayOffset>=0 && todayOffset<totalDays);

  return `
    <div class="gantt">
      <div class="gantt-labels">
        <div class="gantt-label-head"></div>
        ${rows.map(r=>`<div class="gantt-label-row"><div class="gl-t">${escapeHtml(r.it.titulo)}</div><div class="gl-s">${escapeHtml(r.it.responsavel||'—')}</div></div>`).join('')}
      </div>
      <div class="gantt-scroll">
        <div class="gantt-timeline" style="width:${totalWidth}px">
          <div class="gantt-ticks">
            ${ticks}
            ${todayMarker?`<div class="gantt-today-line" style="left:${todayOffset*pxPerDay}px;"><span class="gantt-today-label">Hoje</span></div>`:''}
          </div>
          <div class="gantt-rows">
            ${rows.map(r=>`
              <div class="gantt-row">
                <div class="gantt-bar ${r.cls} ${r.overdue?'overdue':''}" style="left:${r.left}px; width:${r.width}px;" data-edit-deliv="${r.it.id}" title="${escapeHtml(r.it.titulo)}">${escapeHtml(r.it.titulo)}</div>
              </div>
            `).join('')}
            ${todayMarker?`<div class="gantt-today-line" style="left:${todayOffset*pxPerDay}px;"></div>`:''}
          </div>
        </div>
      </div>
    </div>
  `;
}

      onSave:(rec)=>{ rec.eventoId=id; DB.logistica.push(rec); save(); toast('Item adicionado.'); renderEventDetail(id, tab); }

      const rec = byId(DB.logistica, b.dataset.editLogistica);
      openForm('logisticaItem', { data:rec, onSave:(updated)=>{ Object.assign(rec, updated); save(); toast('Item atualizado.'); renderEventDetail(id, tab); } });
    });
    document.querySelectorAll('[data-del-logistica]').forEach(b=>b.onclick=()=>{
      confirmDelete('Excluir este item de logística?', ()=>{ DB.logistica = DB.logistica.filter(x=>x.id!==b.dataset.delLogistica); save(); toast('Item excluído.'); renderEventDetail(id, tab); });
    });
  }

  if(tab==='ocorrencias'){
    document.getElementById('btnAddIncidentEv').onclick = ()=> openForm('incident', {
      data:{eventoId:id}, onSave:(rec)=>{ DB.incidents.push(rec); save(); toast('Ocorrência registrada.'); renderEventDetail(id, tab); }
    });
    document.querySelectorAll('[data-edit-incident]').forEach(b=>b.onclick=()=>{
      const rec = byId(DB.incidents, b.dataset.editIncident);

      confirmDelete('Excluir esta ocorrência?', ()=>{ DB.incidents = DB.incidents.filter(x=>x.id!==b.dataset.delIncident); save(); toast('Ocorrência excluída.'); renderEventDetail(id, tab); });

function renderEventDetail(id, tabKey){
  const ev = byId(DB.events, id);
  if(!ev){ location.hash = '#/eventos'; return; }
  const validKeys = EVENT_TABS.map(t=>t.key);
  const tab = validKeys.includes(tabKey) ? tabKey : 'entregas';

  setTop(ev.nome, 'Detalhe do evento', `
    <button class="btn secondary small" id="btnEditEvent">Editar evento</button>
    <button class="btn danger small" id="btnDeleteEvent">Excluir</button>
  `);

  const budgetItems = DB.budgetItems.filter(b=>b.eventoId===id);
  const scheduleItems = [...DB.schedule.filter(s=>s.eventoId===id)].sort((a,b)=>(a.horario||'').localeCompare(b.horario||''));
  const tasks = DB.tasks.filter(t=>t.eventoId===id);
  const incidents = DB.incidents.filter(i=>i.eventoId===id);
  const deliverables = DB.deliverables.filter(d=>d.eventoId===id);
  const rundownLive = [...DB.rundown.filter(r=>r.eventoId===id)].sort((a,b)=>(a.horario||'').localeCompare(b.horario||''));
  const logisticaItems = DB.logistica.filter(l=>l.eventoId===id);

  const totalPrevisto = budgetItems.reduce((s,b)=>s+(Number(b.valorPrevisto)||0),0);
  const totalReal = budgetItems.reduce((s,b)=>s+(Number(b.valorReal)||0),0);
  const margem = (Number(ev.valorContrato)||0) - totalReal;

  const ctx = { ev, id, budgetItems, scheduleItems, tasks, incidents, deliverables, rundownLive, logisticaItems, totalPrevisto, totalReal, margem };

  const html = `
    <div class="event-header">
      <div>
        <div class="eyebrow">${escapeHtml(ev.status||'')}</div>
        <h2>${escapeHtml(ev.nome)}</h2>
        <div class="event-meta">
          <span>📍 ${escapeHtml(ev.local||'local a definir')}</span>
          <span>📅 ${fmtDateRange(ev.dataInicio, ev.dataFim)}</span>
          ${ev.cliente?`<span>👤 ${escapeHtml(ev.cliente)}</span>`:''}
          ${ev.participantes?`<span><strong>${ev.participantes}</strong> participantes</span>`:''}
        </div>
      </div>
      <div><span class="badge ${{'Prospecção':'gray','Orçamento':'info','Confirmado':'ok','Em produção':'warn','Concluído':'ok','Cancelado':'danger'}[ev.status]||'gray'}" style="font-size:.82rem;">${escapeHtml(ev.status||'—')}</span></div>
    </div>

    ${ev.notas? `<div class="panel"><div class="panel-body small">${escapeHtml(ev.notas)}</div></div>` : ''}

    <div class="subtabs">
      ${EVENT_TABS.map(t=>`<a class="subtab ${t.key===tab?'active':''}" href="#/eventos/${id}/${t.key}">${t.label}</a>`).join('')}
    </div>

    ${eventTabContent(tab, ctx)}
  `;
  document.getElementById('view').innerHTML = html;

  document.getElementById('btnEditEvent').onclick = ()=>openEventForm(ev);
  document.getElementById('btnDeleteEvent').onclick = ()=>{
    confirmDelete(`Excluir o evento <strong>${escapeHtml(ev.nome)}</strong>? Entregas, orçamento, T&amp;M, rundown, logística, tarefas e ocorrências vinculados a ele permanecerão, mas sem evento associado.`, ()=>{
      DB.events = DB.events.filter(e=>e.id!==id);
      save(); toast('Evento excluído.');
      location.hash = '#/eventos';
    });
  };

  wireEventTab(tab, ctx);
}

      </div>
    </div>
    <div class="kanban">
      ${cols.map(c=>`

/* =========================================================
   FINANCEIRO
   ========================================================= */
function renderFinanceiro(){
  setTop('Financeiro','Panorama financeiro por evento','');

  const rows = DB.events.map(e=>{
    const items = DB.budgetItems.filter(b=>b.eventoId===e.id);
    const previsto = items.reduce((s,b)=>s+(Number(b.valorPrevisto)||0),0);
    const real = items.reduce((s,b)=>s+(Number(b.valorReal)||0),0);
    const contrato = Number(e.valorContrato)||0;
    const margem = contrato - real;
    const pendentes = items.filter(b=>(b.statusPagamento||'Pendente')!=='Pago').length;
    return { e, previsto, real, contrato, margem, pendentes };
  });
  const totC = rows.reduce((s,r)=>s+r.contrato,0);
  const totP = rows.reduce((s,r)=>s+r.previsto,0);
  const totR = rows.reduce((s,r)=>s+r.real,0);
  const totM = totC - totR;

  const html = `
    <div class="cards">
      <div class="card"><div class="kpi-label">Total contratado</div><div class="kpi-num" style="font-size:1.6rem;">${fmtMoney(totC)}</div></div>
      <div class="card"><div class="kpi-label">Total previsto (orçamento)</div><div class="kpi-num" style="font-size:1.6rem;">${fmtMoney(totP)}</div></div>
      <div class="card"><div class="kpi-label">Total real gasto</div><div class="kpi-num" style="font-size:1.6rem;">${fmtMoney(totR)}</div></div>
      <div class="card"><div class="kpi-label">Margem estimada</div><div class="kpi-num" style="font-size:1.6rem; color:${totM<0?'var(--danger)':'var(--ok)'}">${fmtMoney(totM)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Por evento</h3></div>
      <div class="panel-body pad0">
        ${rows.length ? `<div class="table-wrap"><table>
          <thead><tr><th>Evento</th><th>Status</th><th class="num">Contrato</th><th class="num">Previsto</th><th class="num">Real</th><th class="num">Margem</th><th>Pagamentos</th></tr></thead>
          <tbody>${rows.map(r=>`
            <tr>
              <td><a class="row-link" href="#/eventos/${r.e.id}/orcamento">${escapeHtml(r.e.nome)}</a></td>
              <td>${badgeForEventStatus(r.e.status)}</td>
              <td class="num">${fmtMoney(r.contrato)}</td>
              <td class="num">${fmtMoney(r.previsto)}</td>
              <td class="num">${fmtMoney(r.real)}</td>
              <td class="num" style="color:${r.margem<0?'var(--danger)':'inherit'}">${fmtMoney(r.margem)}</td>
              <td>${r.pendentes? `<span class="badge warn">${r.pendentes} pendente(s)</span>` : `<span class="badge ok">em dia</span>`}</td>
            </tr>`).join('')}</tbody>
        </table></div>` : `<div class="empty"><div class="ic">$</div>Nenhum evento cadastrado ainda.</div>`}
      </div>
    </div>
  `;
  document.getElementById('view').innerHTML = html;
}

  document.querySelectorAll('[data-del-incident-g]').forEach(b=>b.onclick=()=>{
    confirmDelete('Excluir esta ocorrência?', ()=>{ DB.incidents = DB.incidents.filter(x=>x.id!==b.dataset.delIncidentG); save(); toast('Ocorrência excluída.'); renderOcorrencias(); });

/* =========================================================
   EXPORT / IMPORT
   ========================================================= */
document.getElementById('btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `painel-producao-backup-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup exportado.');
};
document.getElementById('btnImport').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      ['events','vendors','crew','tasks','budgetItems','schedule','deliverables','rundown','logistica','incidents'].forEach(k=>{
        if(!Array.isArray(parsed[k])) parsed[k] = [];
      });
      DB = parsed; save(); toast('Backup importado com sucesso.'); router();
    }catch(err){
      toast('Arquivo inválido.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

/* ---------------- init ---------------- */
router();
